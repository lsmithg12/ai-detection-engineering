title: PoolParty Injection - svchost.exe Suspicious Activity
id: 1b2c3d4e-5f6a-7b8c-9d0e-1f2a3b4c5d6e
status: experimental
description: |
  Detects PoolParty injection (T1055.015) via two complementary patterns:
  (1) A process from a user-writable directory opening svchost.exe with full access
  (EID 10, PROCESS_ALL_ACCESS 0x1fffff) or planting a remote thread (EID 8), which
  matches Fawkes C2 poolparty-injection abusing NtSetInformationWorkerFactory.
  (2) svchost.exe spawning a command interpreter or script host (EID 1), indicating
  injected shellcode executing inside the svchost thread pool post-injection.
references:
  - https://attack.mitre.org/techniques/T1055/015/
  - https://github.com/galoryber/fawkes
author: Detection Engineering
date: 2026/03/25
modified: 2026/04/04
tags:
  - attack.privilege_escalation
  - attack.defense_evasion
  - attack.t1055.015
  - detection.fawkes
logsource:
  product: windows
  service: sysmon
detection:
  selection_eid10:
    event.code: '10'
    winlog.event_data.GrantedAccess: '0x1FFFFF'
    winlog.event_data.TargetImage|endswith: '\svchost.exe'
  selection_eid8:
    event.code: '8'
    winlog.event_data.TargetImage|endswith: '\svchost.exe'
  selection_suspicious_source:
    process.executable|contains:
      - '\AppData\'
      - '\Temp\'
      - '\ProgramData\'
      - '\Users\Public\'
  filter_security_products:
    process.name:
      - 'MsMpEng.exe'
      - 'MpCmdRun.exe'
  filter_trusted_paths:
    process.executable|startswith:
      - 'C:\Windows\System32\'
      - 'C:\Program Files\'
      - 'C:\Program Files (x86)\'
  selection_eid1_spawn:
    event.code: '1'
    process.parent.name: 'svchost.exe'
    process.name:
      - 'cmd.exe'
      - 'powershell.exe'
      - 'wscript.exe'
      - 'cscript.exe'
      - 'mshta.exe'
      - 'rundll32.exe'
      - 'regsvr32.exe'
      - 'msiexec.exe'
  condition: ((selection_eid10 or selection_eid8) and selection_suspicious_source and not filter_security_products and not filter_trusted_paths) or selection_eid1_spawn
falsepositives:
  - Security/monitoring software installed in ProgramData accessing svchost
  - Legitimate software update processes spawned via svchost service host (rare)
level: critical
fields:
  - process.name
  - process.executable
  - process.parent.name
  - process.parent.executable
  - winlog.event_data.GrantedAccess
  - winlog.event_data.TargetImage
  - user.name
  - host.name